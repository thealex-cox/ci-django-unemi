name: CI - Django

# El pipeline se dispara con cada push a main o ci-setup,
# y tambien en cada Pull Request dirigido a main.
on:
  push:
    branches: [main, ci-setup]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Instalar dependencias y ejecutar pruebas
    runs-on: ubuntu-latest

    # Contenedor de servicio: base de datos PostgreSQL para las pruebas
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Verificar configuracion del proyecto
        env:
          USE_POSTGRES: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
        run: python manage.py check

      - name: 5. Ejecutar pruebas automatizadas
        env:
          USE_POSTGRES: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
        run: python manage.py test --verbosity=2
