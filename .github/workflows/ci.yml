name: CI/CD - Django

# El pipeline se dispara con cada push a main, ci-setup, docker-setup o cd-setup,
# y tambien en cada Pull Request dirigido a main.
on:
  push:
    branches: [main, ci-setup, docker-setup, cd-setup]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------
  # JOB 1 (Sesion 1): Integracion Continua - pruebas con PostgreSQL
  # ---------------------------------------------------------------
  test:
    name: Instalar dependencias y ejecutar pruebas
    runs-on: ubuntu-latest

    # Contenedor de servicio: base de datos PostgreSQL para las pruebas
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Verificar configuracion del proyecto
        env:
          USE_POSTGRES: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
        run: python manage.py check

      - name: 5. Ejecutar pruebas automatizadas
        env:
          USE_POSTGRES: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
        run: python manage.py test --verbosity=2

  # ---------------------------------------------------------------
  # JOB 2 (Sesion 3): Build de la imagen Docker + despliegue simulado
  # Solo se ejecuta si las pruebas del JOB 1 pasaron (needs: test)
  # ---------------------------------------------------------------
  build-deploy:
    name: Construir imagen Docker y simular despliegue
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 1. Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Construir la imagen Docker
        run: |
          docker build -t ci-django-unemi:latest -t ci-django-unemi:${{ github.sha }} .
          docker images ci-django-unemi

      - name: 3. Preparar la imagen para DockerHub (simulado)
        run: |
          docker tag ci-django-unemi:latest unemi-grupo/ci-django-unemi:${{ github.sha }}
          echo "Imagen etiquetada para DockerHub: unemi-grupo/ci-django-unemi:${{ github.sha }}"
          echo "SIMULADO - en un entorno real se ejecutaria:"
          echo "  docker login -u USUARIO"
          echo "  docker push unemi-grupo/ci-django-unemi:${{ github.sha }}"

      - name: 4. Exportar la imagen como artefacto
        run: docker save ci-django-unemi:latest | gzip > ci-django-unemi-image.tar.gz

      - name: 5. Guardar el artefacto en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ci-django-unemi-image
          path: ci-django-unemi-image.tar.gz
          retention-days: 7

      - name: 6. Levantar el sistema con Docker Compose
        run: |
          docker compose up -d --no-build
          docker compose ps

      - name: 7. Validar que la aplicacion responde
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/tareas/; then
              echo ""
              echo "La aplicacion respondio correctamente desde el contenedor"
              exit 0
            fi
            echo "Esperando a que Django inicie... intento $i"
            sleep 2
          done
          echo "La aplicacion no respondio a tiempo"
          docker compose logs
          exit 1

      - name: 8. Mostrar registros de los contenedores
        if: always()
        run: docker compose logs

      - name: 9. Detener y limpiar contenedores
        if: always()
        run: docker compose down -v